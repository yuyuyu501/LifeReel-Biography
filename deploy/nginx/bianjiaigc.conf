map $http_upgrade $lifereel_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name bianjiaigc.com;
    client_max_body_size 2050m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lifereel_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bianjiaigc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bianjiaigc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name bianjiaigc.com;
    if ($host = bianjiaigc.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
