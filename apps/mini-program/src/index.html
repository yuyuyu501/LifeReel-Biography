<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' ws://127.0.0.1:5175; form-action 'none'"
    />
    <title>岁忆影传 · 小程序本地预览</title>
    <script>
      <%= htmlWebpackPlugin.options.script %>
    </script>
    <style>
      body {
        margin: 0;
        background: #e8efeb;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }
      #app {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background: #f5f8f7;
      }
      #app .taro_page {
        background: #f5f8f7;
        color: #203c3a;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }
      taro-image-core img.taro-img__mode-aspectfit {
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none;
        object-fit: contain;
      }
      #app .bottom-navigation {
        max-width: 430px;
      }
      .page
        taro-button-core[disabled="false"]:not(.primary-button):not(
          .text-button
        ) {
        color: #25564e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
