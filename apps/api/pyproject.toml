[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lifereel-api"
version = "0.1.0"
description = "LifeReel Biography evidence-first interview and memory API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "alibabacloud-dysmsapi20170525>=4,<5",
  "boto3>=1.35,<2",
  "fastapi>=0.116,<1",
  "faster-whisper>=1.2,<2",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pillow>=12.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.9,<6",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0.43,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/lifereel_api"]

[tool.hatch.build.targets.wheel.force-include]
"../../services/identity/src/lifereel_api/modules/auth" = "lifereel_api/modules/auth"
"../../services/identity/src/lifereel_api/modules/identity" = "lifereel_api/modules/identity"
"../../services/identity/src/lifereel_api/modules/governance" = "lifereel_api/modules/governance"
"../../services/interview/src/lifereel_api/modules/interview" = "lifereel_api/modules/interview"
"../../services/interview/src/lifereel_api/modules/orchestration" = "lifereel_api/modules/orchestration"
"../../services/memory/src/lifereel_api/modules/memory" = "lifereel_api/modules/memory"
"../../services/script/src/lifereel_api/modules/script" = "lifereel_api/modules/script"
"../../services/book/src/lifereel_api/modules/book" = "lifereel_api/modules/book"
"../../services/media/src/lifereel_api/modules/evidence" = "lifereel_api/modules/evidence"
"../../services/media/src/lifereel_api/modules/restoration" = "lifereel_api/modules/restoration"
"../../services/media/src/lifereel_api/modules/production" = "lifereel_api/modules/production"
"../../services/media/src/lifereel_api/modules/publication" = "lifereel_api/modules/publication"
"../../services/billing/src/lifereel_api/modules/billing" = "lifereel_api/modules/billing"
"../../services/tasks/src/lifereel_api/modules/jobs" = "lifereel_api/modules/jobs"
"../../services/model-gateway/src/lifereel_api/providers" = "lifereel_api/providers"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
