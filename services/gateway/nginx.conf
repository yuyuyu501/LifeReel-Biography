map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
map $uri $service_backend {
  ~^/v1/(auth|persons|consents|audit)(/|$) identity:8000;
  ~^/v1/(chapters|interviews|interview-voice)(/|$) interview:8000;
  ~^/v1/memories(/|$) memory:8000;
  ~^/v1/scripts(/|$) script:8000;
  ~^/v1/books(/|$) book:8000;
  ~^/v1/(evidence|photo-restoration|production|publications|public)(/|$) media:8000;
  ~^/v1/wallet(/|$) billing:8000;
  ~^/v1/jobs(/|$) tasks:8000;
  ~^/v1/providers(/|$) model-gateway:8000;
  default "";
}
server {
  listen 8000;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  client_max_body_size 2050m;
  location = /health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }
  location = /ready { set $status_backend tasks:8000; proxy_pass http://$status_backend/cluster-ready; }
  location = /system-status { set $status_backend tasks:8000; proxy_pass http://$status_backend/cluster-status; }
  location ^~ /internal { return 404; }
  location ^~ /v1/internal { return 404; }
  location ~ ^/v1/production/runs/[^/]+/execute$ { return 404; }
  location / {
    if ($service_backend = "") { return 404; }
    proxy_pass http://$service_backend$request_uri;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Tenant-ID "";
    proxy_set_header X-Worker-Key "";
    proxy_set_header X-Service-Name "";
    proxy_set_header X-Service-Time "";
    proxy_set_header X-Service-Signature "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
}
