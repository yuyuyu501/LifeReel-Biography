name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lifereel
          POSTGRES_PASSWORD: ci-migration-password
          POSTGRES_DB: lifereel_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifereel -d lifereel_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Verify migrations from empty PostgreSQL database
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
        run: alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lifereel/web lint
      - run: pnpm --filter @lifereel/web test
      - run: pnpm --filter @lifereel/web build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml
      - run: pip install -e .
      - run: python -m compileall -q src

  compose:
    runs-on: ubuntu-latest
    env:
      API_ACCESS_KEY: ci-api-key
      AUTH_TOKEN_SECRET: ci-auth-token-secret
      BOOTSTRAP_OWNER_EMAIL: ci@example.com
      BOOTSTRAP_OWNER_PASSWORD: ci-strong-password
      MINIO_ROOT_PASSWORD: ci-minio-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
