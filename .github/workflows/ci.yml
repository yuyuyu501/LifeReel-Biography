name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lifereel
          POSTGRES_PASSWORD: ci-migration-password
          POSTGRES_DB: lifereel_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifereel -d lifereel_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - run: pip install -e ".[dev]"
      - run: ruff check --config ../../ruff.toml src tests alembic ../../services ../../workers
      - run: pytest
      - name: Verify production database credentials and port configuration
        run: pytest ../../deploy/tests/test_database_configuration.py
      - name: Verify migrations from empty PostgreSQL database
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
        run: alembic upgrade head
      - name: Verify model and migration metadata agree
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
        run: alembic check
      - name: Verify service schema migration preserves data and rollback
        env:
          SCHEMA_TEST_DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
          SCHEMA_REQUIRE_POSTGRES: "1"
        run: pytest tests/test_service_schemas.py -v
      - name: Verify chapter asset foreign key upgrade and deletion behavior
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
        run: pytest tests/test_chapter_asset_migration.py
      - name: Verify concurrent evidence uploads on PostgreSQL
        env:
          EVIDENCE_TEST_DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
          EVIDENCE_REQUIRE_POSTGRES: "1"
        run: pytest tests/test_asset_upload_concurrency.py -k postgresql -v
      - name: Verify recharge channels preserve historical payments
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://lifereel:ci-migration-password@localhost:5432/lifereel_migration_test
        run: pytest tests/test_recharge_migration.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lifereel/web lint
      - run: pnpm --filter @lifereel/web test
      - run: pnpm --filter @lifereel/web build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_worker_execution.py tests/test_independent_services.py

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull nginx:1.27-alpine
      - run: docker pull python:3.10-slim
      - name: Verify upstream replacement and private proxy routes
        run: python apps/web/tests/test_nginx.py --output tmp/nginx-results.json

  compose:
    runs-on: ubuntu-latest
    env:
      API_ACCESS_KEY: ci-api-key
      AUTH_TOKEN_SECRET: ci-auth-token-secret
      BOOTSTRAP_OWNER_EMAIL: ci@example.com
      BOOTSTRAP_OWNER_PASSWORD: ci-strong-password
      POSTGRES_PASSWORD: ci-compose-password
      DATABASE_URL: postgresql+psycopg://lifereel:ci-compose-password@postgres:5432/lifereel
      LIFEREEL_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.production.yaml config --quiet

  services-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Prepare isolated mock configuration
        run: |
          mkdir -p tmp/services-qa
          cat > tmp/services-qa/runtime.env <<'EOF'
          LIFEREEL_ENV_FILE=./tmp/services-qa/runtime.env
          LIFEREEL_RELEASE=services-qa
          POSTGRES_PASSWORD=synthetic-ci-password
          DATABASE_URL=postgresql+psycopg://lifereel:synthetic-ci-password@postgres:5432/lifereel
          POSTGRES_BIND_HOST=127.0.0.1
          POSTGRES_PORT=55439
          WEB_BIND_HOST=127.0.0.1
          WEB_PORT=5189
          API_ACCESS_KEY=synthetic-ci-api-key
          AUTH_TOKEN_SECRET=synthetic-ci-auth-secret-at-least-32-characters
          AUTH_COOKIE_SECURE=false
          BOOTSTRAP_OWNER_EMAIL=services-qa@example.com
          BOOTSTRAP_OWNER_PASSWORD=synthetic-ci-owner-password
          LLM_PROVIDER=mock
          ASR_PROVIDER=mock
          IMAGE_PROVIDER=mock
          VIDEO_PROVIDER=mock
          VOICE_PROVIDER=mock
          REALTIME_VOICE_PROVIDER=disabled
          SMS_ENABLED=false
          MANUAL_WECHAT_ENABLED=false
          MANUAL_ALIPAY_ENABLED=false
          STORAGE_BACKEND=local
          BILLING_TEXT_MODE=per_successful_chapter_update
          BILLING_VIDEO_MODE=per_second
          EOF
      - name: Build and start isolated services
        run: docker compose --env-file tmp/services-qa/runtime.env -p lifereel-servicesqa -f compose.production.yaml up -d --build --wait --wait-timeout 180
      - name: Verify business flow, fault recovery and model gateway
        run: |
          python deploy/tests/service_e2e.py --env-file tmp/services-qa/runtime.env --output tmp/services-qa/e2e-results.json
          python deploy/tests/model_gateway_e2e.py --env-file tmp/services-qa/runtime.env --output tmp/services-qa/model-gateway-results.json
          docker compose --env-file tmp/services-qa/runtime.env -p lifereel-servicesqa -f compose.production.yaml exec -T tasks sh -c 'cd /workspace/apps/api && alembic check'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-services-results
          path: tmp/services-qa/*results.json
      - name: Clean up isolated resources
        if: always()
        run: docker compose --env-file tmp/services-qa/runtime.env -p lifereel-servicesqa -f compose.production.yaml down -v
