name: lifereel-biography

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://lifereel:lifereel@postgres:5432/lifereel
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      LOCAL_STORAGE_PATH: /data/private
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION_NAME: ${S3_REGION_NAME:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      OSS_DIRECT_UPLOAD_ENABLED: ${OSS_DIRECT_UPLOAD_ENABLED:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lifereel}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set S3_SECRET_KEY or MINIO_ROOT_PASSWORD in .env}}
      S3_BUCKET: ${S3_BUCKET:-lifereel-private}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Set API_ACCESS_KEY in .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?Set BOOTSTRAP_OWNER_EMAIL in .env}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:?Set BOOTSTRAP_OWNER_PASSWORD in .env}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-家庭管理员}
      MAX_EVIDENCE_IMAGE_BYTES: ${MAX_EVIDENCE_IMAGE_BYTES:-20971520}
      MAX_EVIDENCE_DOCUMENT_BYTES: ${MAX_EVIDENCE_DOCUMENT_BYTES:-52428800}
      MAX_EVIDENCE_AUDIO_BYTES: ${MAX_EVIDENCE_AUDIO_BYTES:-524288000}
      MAX_EVIDENCE_VIDEO_BYTES: ${MAX_EVIDENCE_VIDEO_BYTES:-2147483648}
      AUTO_CREATE_SCHEMA: "false"
      JOB_QUEUE_BACKEND: database
      EXECUTE_MOCK_JOBS_INLINE: "false"
      INTERVIEW_CONCURRENCY: ${INTERVIEW_CONCURRENCY:-3}
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-1}
      MEDIA_DIRECT_READ: ${MEDIA_DIRECT_READ:-${OSS_DIRECT_UPLOAD_ENABLED:-false}}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      SMS_SECURITY_TEMPLATE_CODE: ${SMS_SECURITY_TEMPLATE_CODE:-}
      SMS_RESET_TEMPLATE_CODE: ${SMS_RESET_TEMPLATE_CODE:-}
      SMS_CODE_PARAMETER: ${SMS_CODE_PARAMETER:-code}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-500}
      BILLING_PRICE_VERSION: ${BILLING_PRICE_VERSION:-standard-2026-09-luna20}
      BILLING_WELCOME_BONUS_CENTS: ${BILLING_WELCOME_BONUS_CENTS:-2000}
      BILLING_VIDEO_CENTS_PER_SECOND: ${BILLING_VIDEO_CENTS_PER_SECOND:-80}
      BILLING_VIDEO_MODE: ${BILLING_VIDEO_MODE:-tokens}
      BILLING_VIDEO_RESERVE_CENTS: ${BILLING_VIDEO_RESERVE_CENTS:-2400}
      BILLING_SCRIPT_CHAPTER_CENTS: ${BILLING_SCRIPT_CHAPTER_CENTS:-40}
      BILLING_TEXT_MODE: ${BILLING_TEXT_MODE:-per_successful_chapter_update}
      MANUAL_WECHAT_ENABLED: ${MANUAL_WECHAT_ENABLED:-false}
      MANUAL_WECHAT_QR_PATH: /data/payments/wechat-qr.png
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      PHOTO_REDRAW_PROVIDER: ${PHOTO_REDRAW_PROVIDER:-disabled}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      INTERVIEW_LLM_MODEL: ${INTERVIEW_LLM_MODEL:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
      SCRIPT_LLM_MODEL: ${SCRIPT_LLM_MODEL:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      MEDIA_PROVIDER_NAME: ${MEDIA_PROVIDER_NAME:-generic-media}
      MEDIA_PROVIDER_BASE_URL: ${MEDIA_PROVIDER_BASE_URL:-}
      MEDIA_PROVIDER_API_KEY: ${MEDIA_PROVIDER_API_KEY:-}
      MEDIA_PROVIDER_POLL_SECONDS: ${MEDIA_PROVIDER_POLL_SECONDS:-2}
      MEDIA_PROVIDER_TIMEOUT_SECONDS: ${MEDIA_PROVIDER_TIMEOUT_SECONDS:-900}
      VOLCENGINE_API_BASE_URL: ${VOLCENGINE_API_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      VOLCENGINE_VIDEO_MODEL: ${VOLCENGINE_VIDEO_MODEL:-doubao-seedance-2-0-mini-260615}
      VOLCENGINE_VIDEO_RESOLUTION: ${VOLCENGINE_VIDEO_RESOLUTION:-720p}
      VOLCENGINE_VIDEO_RATIO: ${VOLCENGINE_VIDEO_RATIO:-16:9}
      VOLCENGINE_VIDEO_DURATION: ${VOLCENGINE_VIDEO_DURATION:-5}
      VOLCENGINE_VIDEO_GENERATE_AUDIO: ${VOLCENGINE_VIDEO_GENERATE_AUDIO:-true}
      VOLCENGINE_VIDEO_WATERMARK: ${VOLCENGINE_VIDEO_WATERMARK:-true}
      VOLCENGINE_VIDEO_POLL_SECONDS: ${VOLCENGINE_VIDEO_POLL_SECONDS:-10}
      VOLCENGINE_VIDEO_TIMEOUT_SECONDS: ${VOLCENGINE_VIDEO_TIMEOUT_SECONDS:-900}
    ports:
      - "8000:8000"
    dns:
      - ${CONTAINER_DNS_SERVER:-223.5.5.5}
    volumes:
      - private-data:/data/private
      - ./data/payments:/data/payments:ro
      - ./data/models/whisper-small:/models/whisper-small:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    environment:
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Set API_ACCESS_KEY in .env}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-2050m}
      NGINX_ENVSUBST_FILTER: API_ACCESS_KEY|NGINX_CLIENT_MAX_BODY_SIZE
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      API_INTERNAL_URL: http://api:8000
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Set API_ACCESS_KEY in .env}
      INTERVIEW_CONCURRENCY: ${INTERVIEW_CONCURRENCY:-3}
      VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-1}
    stop_grace_period: 60s
    dns:
      - ${CONTAINER_DNS_SERVER:-223.5.5.5}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/lifereel-worker-heartbeat').read_text()) < 15"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lifereel
      POSTGRES_USER: lifereel
      POSTGRES_PASSWORD: lifereel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifereel -d lifereel"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lifereel
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lifereel $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/lifereel-private &&
      mc anonymous set none local/lifereel-private
      "
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

volumes:
  private-data:
  postgres-data:
  redis-data:
  minio-data:
