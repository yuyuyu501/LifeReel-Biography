name: lifereel-production

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend: &backend
  <<: *runtime
  env_file: ${LIFEREEL_ENV_FILE:-.env}
  environment: &backend-env
    APP_ENV: production
    SERVICE_MODE: distributed
    API_ACCESS_KEY: ${API_ACCESS_KEY:?Set API_ACCESS_KEY}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with a URL-encoded password}
    REDIS_URL: redis://redis:6379/0
    AUTO_CREATE_SCHEMA: "false"
    EXECUTE_MOCK_JOBS_INLINE: "false"
    JOB_QUEUE_BACKEND: database
    INTERVIEW_CONCURRENCY: ${INTERVIEW_CONCURRENCY:-3}
    VIDEO_CONCURRENCY: ${VIDEO_CONCURRENCY:-1}
    DB_POOL_SIZE: "2"
    DB_MAX_OVERFLOW: "2"
    LLM_CONCURRENCY: "4"
    LLM_STREAM: ${LLM_STREAM:-true}
    LLM_STREAM_MAX_SECONDS: ${LLM_STREAM_MAX_SECONDS:-600}
    MEDIA_DIRECT_READ: "true"
    MEDIA_URL_SECONDS: "900"
    STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
    WHISPER_DEVICE: cpu
    WHISPER_COMPUTE_TYPE: int8
    WHISPER_CPU_THREADS: "2"
    WHISPER_MODEL_PATH: /models/whisper-small
    LOCAL_STORAGE_PATH: /data/private
    MANUAL_WECHAT_QR_PATH: /data/payments/wechat-qr.png
    MANUAL_ALIPAY_QR_PATH: /data/payments/alipay-qr.png
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
  volumes:
    - private-data:/data/private
    - ./data/models/whisper-small:/models/whisper-small:ro
    - ./data/payments:/data/payments:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
    interval: 10s
    timeout: 5s
    start_period: 45s
    retries: 12

services:
  postgres:
    <<: *runtime
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: lifereel
      POSTGRES_USER: lifereel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifereel -d lifereel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *runtime
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: lifereel/backend-runtime:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file: ${LIFEREEL_ENV_FILE:-.env}
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: identity
    working_dir: /workspace/apps/api
    command: ["sh", "-c", "alembic upgrade head && python -m lifereel_api.bootstrap"]
    restart: "no"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *runtime
    image: lifereel/gateway:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    mem_limit: 48m
    networks:
      default:
        aliases: [api]
    depends_on:
      tasks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity:
    <<: *backend
    image: lifereel/identity:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/identity/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: identity
    mem_limit: 256m

  interview:
    <<: *backend
    image: lifereel/interview:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/interview/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: interview
    mem_limit: 384m

  memory:
    <<: *backend
    image: lifereel/memory:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/memory/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: memory
    mem_limit: 320m

  script:
    <<: *backend
    image: lifereel/script:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/script/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: script
    mem_limit: 384m

  media:
    <<: *backend
    image: lifereel/media:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/media/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: media
    mem_limit: 384m

  billing:
    <<: *backend
    image: lifereel/billing:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: billing
    mem_limit: 256m

  tasks:
    <<: *backend
    image: lifereel/tasks:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/tasks/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: tasks
    mem_limit: 192m

  model-gateway:
    <<: *backend
    image: lifereel/model-gateway:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: services/model-gateway/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: model-gateway
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "6"
    mem_limit: 1536m

  worker-interview:
    <<: *backend
    image: lifereel/worker-interview:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: workers/interview/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: worker-interview
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "8"
    mem_limit: 384m
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/lifereel-worker-heartbeat').read_text()) < 60"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker-media:
    <<: *backend
    image: lifereel/worker-media:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: workers/media/Dockerfile
      additional_contexts:
        backend-runtime: service:migrate
    environment:
      <<: *backend-env
      LIFEREEL_SERVICE: worker-media
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "4"
    mem_limit: 1024m
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/lifereel-worker-heartbeat').read_text()) < 60"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    <<: *runtime
    image: lifereel/web:${LIFEREEL_RELEASE:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-5173}:80"
    environment:
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Set API_ACCESS_KEY}
      API_UPSTREAM: gateway:8000
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-2050m}
      NGINX_ENVSUBST_FILTER: API_ACCESS_KEY|API_UPSTREAM|NGINX_CLIENT_MAX_BODY_SIZE
    mem_limit: 128m
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  private-data:
